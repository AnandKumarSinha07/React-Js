<body style="background-color: #212121; color:#fff">
    <ul class="language">
        <li>Javascript</li>
    </ul>

    <ul class="Resturant">
        <li>Chawal</li>
    </ul>
</body>

<script>
    
    function addLanguage(langName){
      const newLi=document.createElement('li');
      newLi.innerHTML=`${langName}`;
      const selectUl=document.querySelector('.language');
      selectUl.appendChild(newLi);
    }
console.log(addLanguage("Python"));
console.log(addLanguage("Java"));

function Optimize(langName){
    const li=document.createElement('li');
    li.appendChild(document.createTextNode(langName))
    document.querySelector('.language').appendChild(li)
}
console.log(Optimize("Mongo-db"));
